<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Pressure Risk Dashboard</title>
<style>
  body {
    background: #14161a;
    color: #e6e6e6;
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  #status {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  #status.ok { background: #1f3a2a; color: #6fd18a; }
  #status.warn { background: #3a1f1f; color: #ff8080; }
  #connStatus {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    margin-left: 8px;
  }
  #connStatus.ok { background: #1f3a2a; color: #6fd18a; }
  #connStatus.warn { background: #3a1f1f; color: #ff8080; }
  #connStatus.unknown { background: #2a2c30; color: #a0a4ab; }
  #meta { font-size: 13px; color: #a0a4ab; margin-bottom: 16px; line-height: 1.6; }
  canvas { border: 1px solid #333; image-rendering: pixelated; background: #0a0b0d; }
  #riskImage { display: none; margin-top: 16px; max-width: 100%; border: 1px solid #333; }
  #legend { margin-top: 12px; font-size: 12px; color: #a0a4ab; }
  #legend span { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; border-radius: 2px; }
</style>
</head>
<body>
  <h1>Pressure Risk Dashboard</h1>
  <div id="status" class="ok">대기 중</div>
  <div id="connStatus" class="unknown">클라이언트 상태 확인 중</div>
  <div id="meta">이벤트 없음</div>
  <canvas id="grid"></canvas>
  <div id="legend">
    <span style="background:#3a3f4a"></span>압력 감지 (실루엣)
    <span style="background:#ff3b3b; margin-left:16px"></span>위험 셀 (risky_idx)
  </div>
  <img id="riskImage" alt="위험 경고 스냅샷">
  <div id="imageMeta" style="display:none; font-size:12px; color:#a0a4ab; margin-top:4px;">위험 경고 스냅샷 (현재 프레임 + risk point overlay)</div>

<script>
const POLL_MS = 1500;
const canvas = document.getElementById('grid');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const connStatusEl = document.getElementById('connStatus');
const metaEl = document.getElementById('meta');
const riskImageEl = document.getElementById('riskImage');
const imageMetaEl = document.getElementById('imageMeta');

const CELL = 2.5; // px per grid cell, square (1/4 of the original 10px)

// The grid is drawn rotated 90° counter-clockwise from its raw (row, col)
// layout: fill/render calls below use the raw coordinate space, and a
// canvas transform (translate + rotate(-90deg)) maps that space onto the
// visible (swapped-dimension) canvas.
function drawGrid(data) {
  const cols = data.cols, rows = data.rows;
  const rawW = cols * CELL, rawH = rows * CELL;

  // CCW 90 rotation swaps displayed width/height relative to the raw grid.
  if (canvas.width !== rawH || canvas.height !== rawW) {
    canvas.width = rawH;
    canvas.height = rawW;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.translate(0, canvas.height);
  ctx.rotate(-Math.PI / 2);

  const state = data.latest_state;
  if (state && state.pressure && state.pressure.length === cols * rows) {
    for (let i = 0; i < state.pressure.length; i++) {
      const v = state.pressure[i];
      const row = Math.floor(i / cols), col = i % cols;
      ctx.fillStyle = `rgb(${v},${v},${v})`;
      ctx.fillRect(col * CELL, row * CELL, CELL, CELL);
    }
  } else if (data.latest_event) {
    ctx.fillStyle = '#3a3f4a';
    for (const [row, col] of data.latest_event.pressure_mask_cells) {
      ctx.fillRect(col * CELL, row * CELL, CELL, CELL);
    }
  }

  if (data.latest_event) {
    ctx.fillStyle = '#ff3b3b';
    for (const [row, col] of data.latest_event.risky_cells) {
      ctx.fillRect(col * CELL, row * CELL, CELL, CELL);
    }
  }
}

function updateStatus(data) {
  if (data.has_warning) {
    statusEl.className = 'warn';
    statusEl.textContent = '위험 경고';
    const ev = data.latest_event;
    const receivedAt = new Date(ev.received_at * 1000).toLocaleTimeString('ko-KR');
    metaEl.textContent =
      `accumulated_time=${ev.accumulated_time}  |  위험 셀 ${ev.risky_cells.length}개  |  수신 ${receivedAt}`;
  } else {
    statusEl.className = 'ok';
    statusEl.textContent = '정상';
    metaEl.textContent = '이벤트 없음';
  }
}

function updateConnStatus(data) {
  if (data.connected === true) {
    connStatusEl.className = 'ok';
    connStatusEl.textContent = '클라이언트 연결됨';
  } else if (data.connected === false) {
    connStatusEl.className = 'warn';
    const since = data.last_seen ? new Date(data.last_seen * 1000).toLocaleTimeString('ko-KR') : '?';
    connStatusEl.textContent = `클라이언트 연결 끊김 (마지막 수신 ${since})`;
  } else {
    connStatusEl.className = 'unknown';
    connStatusEl.textContent = '클라이언트 상태 확인 중';
  }
}

function updateImage(data) {
  if (data.has_image) {
    riskImageEl.src = '/image/latest?t=' + Date.now();
    riskImageEl.style.display = 'block';
    imageMetaEl.style.display = 'block';
  } else {
    riskImageEl.style.display = 'none';
    imageMetaEl.style.display = 'none';
  }
}

async function poll() {
  try {
    const resp = await fetch('/api/latest');
    const data = await resp.json();
    drawGrid(data);
    updateStatus(data);
    updateConnStatus(data);
    updateImage(data);
  } catch (e) {
    statusEl.className = 'warn';
    statusEl.textContent = '서버 연결 실패';
    connStatusEl.className = 'unknown';
    connStatusEl.textContent = '클라이언트 상태 확인 중';
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
